# Tiny Tapeout project information
project:
  title:        "Tiny-TPU v2: INT8 MAC with input buffer"      # Project title
  author:       "Alex Salamati, James Manikyan, Marco Flores"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Signed INT8 multiply-accumulate PE, 22-bit sums, 32-byte input buffer, handshake or streaming host interface"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "2x2"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_titaniumthunder_tiny_tpu8"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "tiny_tpu_pe8.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "DATA[0]"
  ui[1]: "DATA[1]"
  ui[2]: "DATA[2]"
  ui[3]: "DATA[3]"
  ui[4]: "DATA[4]"
  ui[5]: "DATA[5]"
  ui[6]: "DATA[6]"
  ui[7]: "DATA[7]"

  # Outputs
  uo[0]: "OUT[0] (byte selected by BSEL)"
  uo[1]: "OUT[1] (byte selected by BSEL)"
  uo[2]: "OUT[2] (byte selected by BSEL)"
  uo[3]: "OUT[3] (byte selected by BSEL)"
  uo[4]: "OUT[4] (byte selected by BSEL)"
  uo[5]: "OUT[5] (byte selected by BSEL)"
  uo[6]: "OUT[6] (byte selected by BSEL)"
  uo[7]: "OUT[7] (byte selected by BSEL)"

  # Bidirectional pins
  uio[0]: "CMD[0]"
  uio[1]: "CMD[1]"
  uio[2]: "CMD[2]"
  uio[3]: "STROBE / VALID"
  uio[4]: "MODE (0 handshake, 1 streaming)"
  uio[5]: "BSEL[0]"
  uio[6]: "BSEL[1]"
  uio[7]: "ACK"

# Do not change!
yaml_version: 6
